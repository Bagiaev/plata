x-app: &app
  image: plata-quote:local
  build: .
  environment:
    DATABASE_URL: postgres://plata:plata_dev@postgres:5432/plata?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plata
      POSTGRES_USER: plata
      POSTGRES_PASSWORD: plata_dev
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "plata", "-d", "plata"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    <<: *app
    command: ["/usr/local/bin/plata-migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
